<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Noto+Sans+Javanese:wght@400..700&display=swap" rel="stylesheet">
</head>

<script>
  function redirectLogin(e) {
    e.preventDefault();

    const email = document.getElementById("email").value
      .trim()
      .toLowerCase();

    if (email === "guru@gmail.com") {
      window.location.href = "beranda_guru.html";
    } 
    else if (email === "siswa@gmail.com") {
      window.location.href = "beranda_siswa.html";
    } 
    else {
      alert("Email tidak dikenali!");
    }
  }
</script>

<body>

  <!-- CONTAINER -->
  <div class="container">

    <!-- CARD LOGIN -->
    <div class="card_login">

      <!-- LOGO -->
      <div class="logo_area">
        <img src="ebadu.png" class="logo_login">
      </div>

      <!-- FORM -->
      <form onsubmit="redirectLogin(event)">

        <!-- EMAIL -->
        <div class="login_input">
          <label>Alamat e-mail</label>

          <input 
            type="email" 
            id="email"
            placeholder="Enter Email"
            required
          >
        </div>

        <!-- PASSWORD -->
        <div class="login_input">

          <label>Kata Sandi</label>

          <div class="password_wrapper">

            <input 
              type="password"
              placeholder="Enter Kata Sandi"
            >

            <span class="eye">
              <img src="icon_eye.png">
            </span>

          </div>
        </div>

        <!-- REMEMBER -->
        <div class="forgot">

          <label class="remember">
            <input type="checkbox">
            <span>Ingat Saya</span>
          </label>

          <a href="#">
            Lupa Kata Sandi Anda ?
          </a>

        </div>

        <!-- BUTTON -->
        <button type="submit" class="button">
          Masuk
        </button>

      </form>

    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    Copyright @ 2026 SMAN 2 BANGUNTAPAN. All Rights Reserved
    <br>
    Powered by Mediadidik.com
  </footer>

</body>
</html>
